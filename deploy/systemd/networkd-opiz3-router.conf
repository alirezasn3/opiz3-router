# Install as /etc/systemd/networkd.conf.d/opiz3-router.conf
#
# By default systemd-networkd deletes every routing rule and route it did not
# create whenever it configures a link, for example when the USB modem is
# plugged in. That removes the router's VPN rule and routes. These settings
# make networkd leave them alone.
[Network]
ManageForeignRoutingPolicyRules=no
ManageForeignRoutes=no
