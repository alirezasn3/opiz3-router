network:
  version: 2
  renderer: networkd
  ethernets:
    end0:
      dhcp4: true
      dhcp4-overrides:
        use-dns: false
        route-metric: 100
      nameservers:
        addresses:
          - 1.1.1.1
          - 8.8.8.8
    enxd236db4ff68a:
      dhcp4: true
      dhcp4-overrides:
        use-dns: false
        route-metric: 101
      nameservers:
        addresses:
          - 1.1.1.1
          - 8.8.8.8
  bridges:
    br0:
      addresses:
        - 172.16.0.1/12
  wifis:
    wlan0:
      dhcp4: true
      access-points:
        "YOUR_WIFI_SSID":
          password: "YOUR_WIFI_PASSWORD"